name: ProfitLands Economy Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economy-regression:
    name: All four economy modes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all tracked JavaScript parses
        run: git ls-files -z -- '*.js' '*.cjs' '*.mjs' | xargs -0 -r -n1 node --check
      - name: Verify Firebase server dependency resolution
        run: npm --prefix functions install --no-audit --no-fund --ignore-scripts
      - name: Run economy regression suite
        id: regression
        shell: bash
        run: |
          set +e
          npm test > /tmp/profitlands-test.log 2>&1
          outcome=$?
          cat /tmp/profitlands-test.log
          fails=$(grep '^not ok ' /tmp/profitlands-test.log | head -n 3 | cut -c1-125 | tr '\n' ';' || true)
          echo "failing=${fails}" >> "$GITHUB_OUTPUT"
          exit "$outcome"
      - name: "Failed cases: ${{ steps.regression.outputs.failing }}"
        if: failure()
        run: echo "See failing test cases above"
