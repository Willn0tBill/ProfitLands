name: ProfitLands Economy Tests

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'economy-system.js'
      - 'economy-render.js'
      - 'portfolio-performance.css'
      - 'growth-system.js'
      - 'balance-system.js'
      - 'progression.js'
      - 'huge-money.js'
      - 'location-operations.js'
      - 'empire-lab.js'
      - 'empire-lab.css'
      - 'empire-demo.js'
      - 'layout-panels.js'
      - 'layout-panels.css'
      - 'workspace.js'
      - 'workspace.css'
      - 'business-arcade.js'
      - 'business-advancements.js'
      - 'business-advancements.css'
      - 'achievement-engine.js'
      - 'platform.js'
      - 'desktop/**'
      - 'account-trophies.js'
      - 'firebase-auth.js'
      - 'cloud-sync-guard.js'
      - 'steam-achievement-map.js'
      - 'quick-switch.js'
      - 'quick-switch.css'
      - 'save-center.js'
      - 'save-center.css'
      - 'trade-ui.js'
      - 'trade-ui.css'
      - 'achievement-engine.css'
      - 'executive-briefing.js'
      - 'executive-briefing.css'
      - 'business-arcade.css'
      - 'game-polish.css'
      - 'preview/index.html'
      - 'play/index.html'
      - 'cloudflare/**'
      - 'world1-config.js'
      - 'firebase-world-adapter.js'
      - 'multiplayer-world.js'
      - 'tests/**'
      - '.github/workflows/economy-tests.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'economy-system.js'
      - 'economy-render.js'
      - 'portfolio-performance.css'
      - 'growth-system.js'
      - 'balance-system.js'
      - 'progression.js'
      - 'huge-money.js'
      - 'location-operations.js'
      - 'empire-lab.js'
      - 'empire-lab.css'
      - 'empire-demo.js'
      - 'layout-panels.js'
      - 'layout-panels.css'
      - 'workspace.js'
      - 'workspace.css'
      - 'business-arcade.js'
      - 'business-advancements.js'
      - 'business-advancements.css'
      - 'achievement-engine.js'
      - 'platform.js'
      - 'desktop/**'
      - 'account-trophies.js'
      - 'firebase-auth.js'
      - 'cloud-sync-guard.js'
      - 'steam-achievement-map.js'
      - 'quick-switch.js'
      - 'quick-switch.css'
      - 'save-center.js'
      - 'save-center.css'
      - 'trade-ui.js'
      - 'trade-ui.css'
      - 'achievement-engine.css'
      - 'executive-briefing.js'
      - 'executive-briefing.css'
      - 'business-arcade.css'
      - 'game-polish.css'
      - 'preview/index.html'
      - 'play/index.html'
      - 'cloudflare/**'
      - 'world1-config.js'
      - 'firebase-world-adapter.js'
      - 'multiplayer-world.js'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economy-regression:
    name: All four economy modes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript parses
        run: |
          node --check app.js
          node --check economy-system.js
          node --check economy-render.js
          node --check growth-system.js
          node --check balance-system.js
          node --check progression.js
          node --check huge-money.js
          node --check location-operations.js
          node --check empire-lab.js
          node --check empire-demo.js
          node --check layout-panels.js
          node --check workspace.js
          node --check business-arcade.js
          node --check business-advancements.js
          node --check achievement-engine.js
          node --check account-trophies.js
          node --check steam-achievement-map.js
          node --check cloud-sync-guard.js
          node --check firebase-auth.js
          node --check platform.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check executive-briefing.js
          node --check quick-switch.js
          node --check save-center.js
          node --check trade-ui.js
          node --check firebase-world-adapter.js
          node --check multiplayer-world.js
          node --check functions/world-core.js
          node --check functions/pvp-rules.js
          node --check functions/index.js
          node --check cloudflare/src/index.mjs
          node --check cloudflare/src/world-core.mjs
          node --check cloudflare/src/pvp-rules.mjs
      - name: Verify Firebase server dependency resolution
        run: npm --prefix functions install --no-audit --no-fund --ignore-scripts
      - name: Run economy regression suite
        id: regression
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs tests/*.test.mjs > /tmp/profitlands-test.log 2>&1
          outcome=$?
          cat /tmp/profitlands-test.log
          fails=$(grep '^not ok ' /tmp/profitlands-test.log | head -n 3 | cut -c1-125 | tr '\n' ';' || true)
          echo "failing=${fails}" >> "$GITHUB_OUTPUT"
          exit "$outcome"
      - name: "Failed cases: ${{ steps.regression.outputs.failing }}"
        if: failure()
        run: echo "See failing test cases above"
