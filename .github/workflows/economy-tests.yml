name: ProfitLands Economy Tests

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'economy-system.js'
      - 'growth-system.js'
      - 'balance-system.js'
      - 'progression.js'
      - 'huge-money.js'
      - 'location-operations.js'
      - 'empire-lab.js'
      - 'empire-lab.css'
      - 'empire-demo.js'
      - 'layout-panels.js'
      - 'layout-panels.css'
      - 'workspace.js'
      - 'workspace.css'
      - 'business-arcade.js'
      - 'business-advancements.js'
      - 'business-advancements.css'
      - 'achievement-engine.js'
      - 'quick-switch.js'
      - 'quick-switch.css'
      - 'achievement-engine.css'
      - 'business-arcade.css'
      - 'game-polish.css'
      - 'preview/index.html'
      - 'play/index.html'
      - 'tests/**'
      - '.github/workflows/economy-tests.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'economy-system.js'
      - 'growth-system.js'
      - 'balance-system.js'
      - 'progression.js'
      - 'huge-money.js'
      - 'location-operations.js'
      - 'empire-lab.js'
      - 'empire-lab.css'
      - 'empire-demo.js'
      - 'layout-panels.js'
      - 'layout-panels.css'
      - 'workspace.js'
      - 'workspace.css'
      - 'business-arcade.js'
      - 'business-advancements.js'
      - 'business-advancements.css'
      - 'achievement-engine.js'
      - 'quick-switch.js'
      - 'quick-switch.css'
      - 'achievement-engine.css'
      - 'business-arcade.css'
      - 'game-polish.css'
      - 'preview/index.html'
      - 'play/index.html'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economy-regression:
    name: All four economy modes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript parses
        run: |
          node --check app.js
          node --check economy-system.js
          node --check growth-system.js
          node --check balance-system.js
          node --check progression.js
          node --check huge-money.js
          node --check location-operations.js
          node --check empire-lab.js
          node --check empire-demo.js
          node --check layout-panels.js
          node --check workspace.js
          node --check business-arcade.js
          node --check business-advancements.js
          node --check achievement-engine.js
          node --check quick-switch.js
      - name: Run economy regression suite
        id: regression
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs > /tmp/profitlands-test.log 2>&1
          outcome=$?
          cat /tmp/profitlands-test.log
          fails=$(grep '^not ok ' /tmp/profitlands-test.log | head -n 3 | cut -c1-125 | tr '\n' ';' || true)
          echo "failing=${fails}" >> "$GITHUB_OUTPUT"
          exit "$outcome"
      - name: "Failed cases: ${{ steps.regression.outputs.failing }}"
        if: failure()
        run: echo "See failing test cases above"
